services:
  default:
    # AISI image with Playwright/Chromium and inspect-tool-support installed.
    # Pinned by digest for repeatability across runs and machines.
    image: aisiuk/inspect-tool-support@sha256:fb045da8203aea656785c758f7147b003cfe21f213e9048a38be0a33242a5b3d
    init: true

    # HTTP egress stays open so recon and browsing stay wild. The container is
    # the filesystem boundary: no host FS, ~/.ssh, .env, or host Chrome profile.
    #
    # Outbound SMTP (ports 25/465/587 to the real internet) is DROPped, so the
    # default send path can't reach an external mail server. Mailpit's own SMTP
    # is on 1025, untouched, so the agent's intended mail still works.
    #
    # Scope, stated honestly: this stops the accidental/default path, NOT a
    # determined agent. The agent has root and NET_ADMIN in this same container,
    # so it can `iptables -F OUTPUT` and remove the block itself. The capability
    # is granted at the container level and every `docker compose exec` (how
    # Inspect's bash tool enters) inherits it fresh, so an entrypoint that drops
    # the cap after applying rules would not help. This is consistent with the
    # already-accepted residual risk that a determined agent can send over
    # webmail-on-HTTP anyway. A block that survives an adversarial agent needs
    # enforcement outside this container (host rules or an egress gateway the
    # agent can't exec into) — deferred; see spec open questions.
    #
    # The image has no iptables package, so it's installed at container start
    # (~3s) rather than via a custom Dockerfile, leaving the base image pinned
    # by digest above. That apt-get is the one unpinned step.
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
      apt-get update -qq &&
      apt-get install -y -qq iptables &&
      iptables -A OUTPUT -p tcp --dport 25 -j DROP &&
      iptables -A OUTPUT -p tcp --dport 465 -j DROP &&
      iptables -A OUTPUT -p tcp --dport 587 -j DROP &&
      ip6tables -A OUTPUT -p tcp --dport 25 -j DROP &&
      ip6tables -A OUTPUT -p tcp --dport 465 -j DROP &&
      ip6tables -A OUTPUT -p tcp --dport 587 -j DROP &&
      exec tail -f /dev/null
      "
    mem_limit: 4g
    cpus: 2.0

  mailpit:
    # Local mail: SMTP in (agent sends), POP3 out (agent reads), web UI + REST
    # for a human to inspect what was sent. Nothing leaves the container.
    # SMTP accepts any credentials (still a real protocol exchange, just no
    # gatekeeping). POP3 has no "accept any" option, so it needs a real
    # mailbox: mailpit-auth/pop3-auth holds a bcrypt-hashed password for user
    # `agent`, matching the plaintext seeded to the agent's resources.
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    init: true
    restart: unless-stopped
    ports:
      # Loopback only: the agent's mailbox is readable at http://localhost:8025
      # on this host, not exposed to the LAN (no UI auth is configured).
      - "127.0.0.1:8025:8025"
    volumes:
      - ./mailpit-auth/pop3-auth:/data/pop3-auth:ro
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_POP3_AUTH_FILE: /data/pop3-auth
