services:
  default:
    # Browser and code tools run here; email artifacts stay on the host, unmounted.
    build: .
    user: agent:agent
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    command: tail -f /dev/null
    # Network access stays open for research. This does not enforce outbound-mail filtering.
    mem_limit: 4g
    cpus: 2.0
