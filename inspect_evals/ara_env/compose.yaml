x-restricted: &restricted
  build: .
  user: agent:agent
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  command: tail -f /dev/null
  mem_limit: 4g
  cpus: 2.0

services:
  default:
    <<: *restricted
    # The internal network lets the generated site reach only its preview browser.
    networks: [preview_internal]
  preview:
    <<: *restricted
    networks: [preview_internal]
  preview_publish:
    <<: *restricted
    command: python3 /opt/ara/preview_publish.py
    networks: [preview_internal, host_preview]
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
  browser:
    <<: *restricted
    networks: [browser_internal]
    depends_on: [egress]
  egress:
    <<: *restricted
    # Only this trusted service has an external route; no solver tool targets it.
    command: python3 /opt/ara/egress_proxy.py
    networks: [browser_internal, internet]
    read_only: true
    mem_limit: 512m
    cpus: 1.0

networks:
  preview_internal:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  host_preview: {}
  browser_internal:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  internet: {}
